name: Deploy VuePress Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# 必须：Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免重复触发时多个部署并发
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 装 Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建静态站点（脚本里 mkdir -p docs，产物生成到 docs/）
      - name: Build static site
        run: bash scripts/build-docs.sh

      # 5. 上传 Pages 产物
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4